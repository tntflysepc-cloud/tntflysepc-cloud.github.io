name: IndexNow
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 매일 오전 7시(한국 시간)
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent = 최근 24시간 변경분 / all = 전체 페이지(처음 1회만)'
        default: 'recent'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed pages to IndexNow
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 - <<'PY'
          import os,subprocess,json,re,sys,urllib.request,urllib.parse,urllib.error
          HOST='tntflysepc-cloud.github.io'
          KEY='935f640e4d3094ce91c230759d805be6'
          mode=os.environ.get('MODE') or 'recent'
          event=os.environ.get('EVENT','');before=os.environ.get('BEFORE','');sha=os.environ.get('SHA') or 'HEAD'
          def git(*a): return subprocess.run(['git','-c','core.quotepath=off']+list(a),capture_output=True,text=True).stdout
          if mode=='all': out=git('ls-files','*.html')
          elif event=='push' and before and set(before)!={'0'}: out=git('diff','--name-only','--diff-filter=AM',before,sha,'--','*.html')
          else: out=git('log','--since=24 hours ago','--name-only','--diff-filter=AM','--pretty=format:','--','*.html')
          files=sorted({l.strip() for l in out.splitlines() if l.strip()})
          skip=re.compile(r'(^|/)(google[0-9a-f]+|naver[0-9a-f]+|404)\.html$')
          urls=[]
          for f in files:
              if skip.search(f): continue
              p='' if f=='index.html' else (f[:-10] if f.endswith('/index.html') else f)
              urls.append('https://%s/%s'%(HOST,urllib.parse.quote(p)))
          print(mode,len(urls),'URLs')
          if not urls:
              print('변경된 페이지가 없어 전송하지 않아요'); sys.exit(0)
          bad=False
          for i in range(0,len(urls),10000):
              body=json.dumps({'host':HOST,'key':KEY,'keyLocation':'https://%s/%s.txt'%(HOST,KEY),'urlList':urls[i:i+10000]}).encode()
              if os.environ.get('DRY_RUN'): print(body.decode()[:600]); continue
              req=urllib.request.Request('https://api.indexnow.org/indexnow',data=body,headers={'Content-Type':'application/json; charset=utf-8'})
              try:
                  r=urllib.request.urlopen(req,timeout=30);print('status',r.status)
              except urllib.error.HTTPError as e:
                  print('status',e.code,e.read()[:200]);bad=bad or e.code not in (200,202)
          sys.exit(1 if bad else 0)
          PY
