<script>
/* 후기 추가 방법: 아래 배열에 {lang:'영어', name:'김OO님', date:'2026-10', text:'후기 내용'} 형태로 넣으면 자동으로 표시돼요. */
var REVIEWS=[];
(function(){var L=document.getElementById('list'),E=document.getElementById('empty'),T=document.querySelectorAll('.tabs button'),cur='all';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){var a=REVIEWS.filter(function(r){return cur==='all'||r.lang===cur});L.innerHTML=a.map(function(r){return '<div class="card"><span class="who">'+esc(r.lang)+' · '+esc(r.name)+' · '+esc(r.date)+'</span><p>'+esc(r.text)+'</p></div>'}).join('');E.classList.toggle('hide',a.length>0);}
T.forEach(function(b){b.addEventListener('click',function(){cur=b.getAttribute('data-l');T.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});render()})});render();})();
</script></body></html>
